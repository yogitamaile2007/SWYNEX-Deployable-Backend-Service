spring.application.name=swynex-backend-service

# Port: Render/Railway/Heroku provide PORT; defaults to 8080 locally
server.port=${PORT:8080}

# ---- MySQL (default) ----
# The database is created automatically if the MySQL user is allowed to create it.
# Override with environment variables DB_URL, DB_USER, DB_PASSWORD when deploying.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/swynex_tasks?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# Hibernate creates/updates the tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional API key for write endpoints (POST/PUT/DELETE). Empty = no protection.
app.api-key=${API_KEY:}

# Health check endpoint: /actuator/health
management.endpoints.web.exposure.include=health
springdoc.swagger-ui.path=/swagger-ui.html
